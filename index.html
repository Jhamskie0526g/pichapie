<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picha Pie - Secure Kiosk System</title>
<style>
:root{
  --red:#e63946;--yellow:#ffd166;--cream:#fff8ed;
  --dark:#17120f;--brown:#2a1d17;--muted:#8e8179;--line:#eadfd5;
  --white:#fff;--green:#2a9d8f;--shadow:0 18px 50px rgba(58,36,22,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--dark);background-color:#fca311}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.topbar{position:sticky;top:0;z-index:50;background:rgba(255,250,245,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(234,223,213,.8)}
.navwrap{max-width:1180px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px}
.logoMark{width:43px;height:43px;border-radius:14px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px}
.logoText{font-weight:950;font-size:20px;line-height:1}
.nav{display:flex;gap:6px;align-items:center}
.nav a{padding:10px 13px;border-radius:12px;font-weight:750;color:#5e5149;transition:0.2s}
.nav a:hover,.nav a.active{background:#fff0e8;color:var(--red)}

.container{max-width:1180px;margin:auto;padding:25px 22px 70px}
.builder{display:grid;grid-template-columns:1fr 400px;gap:22px;align-items:start}
.card{background:rgba(255,255,255,0.96);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 10px 35px rgba(58,36,22,.1)}
.step{margin-bottom:25px}
.choiceGrid,.checkGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice label,.check{display:flex;align-items:center;gap:9px;border:1px solid var(--line);padding:12px;border-radius:13px;background:#fff;cursor:pointer}
.price{color:var(--red);font-weight:850;font-size:13px;margin-left:auto}

.form{display:grid;gap:12px}
label.field{display:grid;gap:6px;font-size:13px;font-weight:800;color:#4a3f37}
input[type=text],input[type=email],input[type=tel],input[type=password],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none}

.summary{position:sticky;top:86px}
.primary{background:var(--red);color:#fff;border:0;padding:14px 20px;border-radius:14px;font-weight:850;font-size:15px;width:100%}
.hidden{display:none!important}
.err{color:var(--red);font-size:13px;font-weight:600}

/* LOADING OVERLAY MOCK */
.loadingSpinner{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;place-items:center;color:#fff;font-weight:800}
.loadingSpinner.show{display:grid}
</style>
</head>
<body>

<div id="loading" class="loadingSpinner"><div>Processing Request...</div></div>

<header class="topbar">
  <div class="navwrap">
    <div class="brand">
      <div class="logoMark">PP</div>
      <div class="logoText">Picha Pie</div>
    </div>
  </div>
</header>

<main class="container">
  <div class="builder">
    <section class="card">
      <div class="step">
        <h3>1. Contact & Delivery Details</h3>
        <form id="checkoutForm" class="form">
          <label class="field">Full Name*<input required id="custName" type="text" placeholder="Juan Dela Cruz"></label>
          <label class="field">Mobile Number (For Delivery Coordination)*<input required id="custPhone" type="tel" placeholder="0917 123 4567" pattern="[0-9\s-+]{10,13}"></label>
          <label class="field">Complete Address*<textarea required id="custAddr" placeholder="House No., Street, Brgy, City..."></textarea></label>
        </form>
      </div>

      <div class="step">
        <h3>2. Payment Method</h3>
        <div class="form">
          <label><input type="radio" name="payMethod" value="COD" checked> Cash on Delivery (COD)</label>
          <label><input type="radio" name="payMethod" value="ONLINE"> Online Payment (GCash / Maya)</label>
        </div>
        <div id="onlineInfo" class="hidden" style="margin-top:10px;background:#fff0e8;padding:12px;border-radius:12px;font-size:13px;">
          <em>*Secure payment QR code or gateway link will be generated after order placement.</em>
        </div>
      </div>
    </section>

    <aside class="card summary">
      <h3>Order Summary</h3>
      <p style="font-size:14px;">1x Standard Pizza - ₱299.00</p>
      <button class="primary" onclick="submitOrder()">Place Order Securely</button>
      <div id="errMsg" class="err" style="margin-top:10px;"></div>
    </aside>
  </div>
</main>

<script>
// Mock API Service (Simulating Secure Backend Calls)
const ApiService = {
  async createOrder(payload) {
    // Simulate Backend API Latency
    await new Promise(res => setTimeout(res, 1200));

    // Server-side validation simulation
    if (!payload.phone || !payload.address) {
      throw new Error("Phone number and address are required on server.");
    }

    return {
      success: true,
      orderId: "ORD-" + Date.now() + "-" + Math.floor(1000 + Math.random() * 9000), // Secure Unique ID
      status: "PENDING"
    };
  }
};

document.querySelectorAll('input[name="payMethod"]').forEach(el => {
  el.addEventListener('change', (e) => {
    document.getElementById('onlineInfo').classList.toggle('hidden', e.target.value !== 'ONLINE');
  });
});

async function submitOrder() {
  const err = document.getElementById("errMsg");
  const spinner = document.getElementById("loading");
  err.textContent = "";

  const name = document.getElementById("custName").value.trim();
  const phone = document.getElementById("custPhone").value.trim();
  const address = document.getElementById("custAddr").value.trim();

  if (!name || !phone || !address) {
    err.textContent = "Please fill in all required fields including mobile number.";
    return;
  }

  try {
    spinner.classList.add("show");
    
    // Send to Mock Backend API
    const response = await ApiService.createOrder({ name, phone, address });

    if (response.success) {
      alert(`Order Successful!\nOrder ID: ${response.orderId}\nWe will call ${phone} upon delivery.`);
    }
  } catch (error) {
    err.textContent = error.message || "An error occurred while processing.";
  } finally {
    spinner.classList.remove("show");
  }
}
</script>
</body>
</html>
